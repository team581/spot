[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "spot-vision"
version = "0.2.1"
description = "Jetson AprilTag vision service for Team 581"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "opencv-contrib-python-headless>=4.9",
  "protobuf>=7.35.1",
]

[project.optional-dependencies]
nt = ["pyntcore>=2026.2.2,<2027", "robotpy-wpimath>=2026.2.2,<2027"]
systemd = ["sdnotify>=0.3.2"]

[dependency-groups]
dev = ["pytest>=8.2", "pytest-cov>=5.0"]

[project.scripts]
spot-vision = "spot_vision.cli:main"

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["src/spot_vision"]
sdist.include = ["dist/jetson-docs/**"]

[tool.pytest.ini_options]
testpaths = ["tests", "tools/tests"]
pythonpath = ["src", "tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
omit = ["*/tests/*", "*/proto/vision_pb2.py", "*/proto/vision_v2_pb2.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["src/spot_vision/proto/vision_pb2.py", "src/spot_vision/proto/vision_v2_pb2.py"]
