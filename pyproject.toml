[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "spot-vision"
version = "0.2.1"
description = "Jetson AprilTag vision service for Team 581"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "opencv-contrib-python-headless>=4.9",
  "protobuf>=7.35.1",
]

[project.optional-dependencies]
nt = ["pyntcore>=2026.2.2,<2027", "robotpy-wpimath>=2026.2.2,<2027"]
systemd = ["sdnotify>=0.3.2"]

[dependency-groups]
dev = [
    "pyntcore==2026.2.2",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "robotpy-wpimath==2026.2.2",
    "ruff==0.17.3",
    "sdnotify==0.3.2",
    "ty==0.0.96",
]

[project.scripts]
spot-vision = "spot_vision.cli:main"

[tool.scikit-build]
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/spot_vision"]
sdist.include = ["dist/jetson-docs/**"]

[tool.pytest.ini_options]
testpaths = ["tests", "tools/tests"]
pythonpath = ["src", "tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
omit = ["*/tests/*", "*/proto/vision_pb2.py", "*/proto/vision_v2_pb2.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
include = ["src/**/*.py", "tests/**/*.py", "tools/**/*.py", "deploy/**/*.py", "pyproject.toml"]
extend-exclude = ["src/spot_vision/proto/*_pb2.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.uv]
# uv run/sync rebuild the editable extension when its inputs change.
cache-keys = [
  { file = "pyproject.toml" },
  { file = "CMakeLists.txt" },
  { file = "cpp/**/*" },
  { file = "proto/*.proto" },
  { file = "tools/build_manifest.py" },
  { file = "src/spot_vision/web/**/*" },
  { file = "src/spot_vision/**/*.py" },
  { git = { commit = true } },
  { file = "dist/jetson-docs/**/*" },
]

[tool.ty]
baseline = "ty-baseline.json"

[tool.ty.environment]
python-platform = "linux"

[tool.ty.src]
include = ["src/spot_vision"]
exclude = ["src/spot_vision/proto/*_pb2.py"]
