[dependency-groups]
dev = [
    "pyntcore==2026.2.2",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "robotpy-wpimath==2026.2.2",
    "ruff==0.17.3",
    "sdnotify==0.3.2",
    "ty==0.0.96",
    "spot-vision[nt,systemd]",
    "vulture==2.16",
]

[tool.uv.workspace]
members = ["apps/vision"]

[tool.uv.sources]
spot-vision = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["apps/vision/tests", "apps/vision/tools/tests"]
pythonpath = ["apps/vision/src", "apps/vision/tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
omit = ["*/tests/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["apps/vision/src", "apps/vision/tests"]
include = ["apps/**/*.py", "tools/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ty.environment]
python-platform = "linux"
python-version = "3.10"

[tool.ty.src]
include = ["apps/vision/src/spot_vision"]

[tool.vulture]
paths = ["apps", "tools", "check_cameras.py", "vulture_whitelist.py"]
min_confidence = 60
sort_by_size = true
