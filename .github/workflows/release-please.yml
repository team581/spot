name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing camera-preview-vX.Y.Z release to publish or retry
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs['apps/vscode-camera-preview--release_created'] }}
      tag_name: ${{ steps.release.outputs['apps/vscode-camera-preview--tag_name'] }}
      java_client_release_created: ${{ steps.release.outputs['packages/java-client--release_created'] }}
      java_client_tag_name: ${{ steps.release.outputs['packages/java-client--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Verify release version
        working-directory: apps/vscode-camera-preview
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `camera-preview-v${version}`) {
            throw new Error('Release tag must match the extension package version');
          }
          appendFileSync(process.env.GITHUB_ENV, `VSIX=spot-camera-preview-${version}.vsix\n`);
          NODE
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
      - run: pnpm --filter spot-camera-preview... check
      - run: pnpm --filter spot-camera-preview... format
      - run: pnpm --filter spot-camera-preview... lint
      - run: pnpm --filter spot-camera-preview test
      - run: pnpm --filter spot-camera-preview package
      - name: Publish GitHub release with VSIX
        working-directory: apps/vscode-camera-preview
        run: |
          is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
          if [[ "$is_draft" == true ]]; then
            gh release upload "$RELEASE_TAG" "$VSIX" --clobber
            gh release edit "$RELEASE_TAG" --draft=false --verify-tag
          else
            gh release download "$RELEASE_TAG" --pattern "$VSIX" --clobber
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish to VS Code Marketplace
        working-directory: apps/vscode-camera-preview
        run: pnpm exec vsce publish --oidc --packagePath "$VSIX" --skip-duplicate

  publish-java-client:
    needs: release-please
    if: ${{ needs.release-please.outputs.java_client_release_created == 'true' }}
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          ref: ${{ needs.release-please.outputs.java_client_tag_name }}
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build plainJavadocJar
      - name: Check Maven Central
        id: central
        run: |
          version="$(cat packages/java-client/version.txt)"
          http_status="$(curl --head --silent --show-error --connect-timeout 10 --max-time 60 \
            --output /dev/null --write-out '%{http_code}' \
            "https://repo.maven.apache.org/maven2/com/team581/spot/$version/spot-$version.jar")"
          case "$http_status" in
            200) echo 'published=true' >> "$GITHUB_OUTPUT" ;;
            404) echo 'published=false' >> "$GITHUB_OUTPUT" ;;
            *) echo "Unexpected Maven Central response: $http_status" >&2; exit 1 ;;
          esac
      - name: Publish to Maven Central
        if: steps.central.outputs.published != 'true'
        run: ./gradlew publishAndReleaseToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
