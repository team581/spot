name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  nix:
    name: Nix package (${{ matrix.system }})
    strategy:
      matrix:
        include:
          - runner: blacksmith-4vcpu-ubuntu-2404
            system: x86_64-linux
          - runner: blacksmith-4vcpu-ubuntu-2404-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: useblacksmith/checkout@v1
      - name: Mount Nix cache
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-nix-cache-${{ matrix.system }}
          path: /nix
          commit: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
      - name: Prepare Nix installation
        # Recreate host services on each runner while preserving the cached store and database.
        run: sudo rm -f /nix/receipt.json
      - uses: DeterminateSystems/nix-installer-action@v23
        id: nix
      - name: Refresh pnpm dependency cache hash
        run: bash tools/update-pnpm-deps-hash.sh
      - run: nix flake check path:. --all-systems --no-build
      - run: nix fmt -- --check flake.nix nix/*.nix nix/hosts/spot/*.nix
      - run: nix build path:.#checks.${{ matrix.system }}.application -L --cores 2 --max-jobs 2
      - name: Stop Nix before unmounting the cache
        if: ${{ always() && steps.nix.outcome == 'success' }}
        run: sudo systemctl stop nix-daemon.socket determinate-nixd.socket nix-daemon.service

  javascript:
    name: JavaScript and documentation
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
      - run: pnpm check
      - parallel:
          - run: pnpm format
          - run: pnpm lint
          - run: pnpm knip
      - run: pnpm build
      - run: pnpm build:jetson
      - run: pnpm test
      - uses: actions/upload-artifact@v7
        with:
          name: web-assets
          path: |
            dist/jetson-docs
            dist/dashboard
          if-no-files-found: error
          retention-days: 1

  application:
    name: Python application and CUDA geometry
    needs: javascript
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    env:
      # The setup actions manage these tools; mise only runs the application checks.
      MISE_DISABLE_TOOLS: uv
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: actions/download-artifact@v8
        with:
          name: web-assets
          path: dist
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          version-file: .tool-versions
      - uses: jdx/mise-action@v5
        with:
          install: false
      - run: mise run check:application
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
      - name: Mount Playwright browsers
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-playwright-browsers-ubuntu-2404-${{ runner.arch }}
          path: ~/.cache/ms-playwright
          commit: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
      - run: pnpm --filter spot-dashboard exec playwright install --with-deps chromium
      - run: pnpm --filter spot-dashboard test:browser
      - name: Upload browser test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-browser-results
          path: apps/dashboard/test-results
          if-no-files-found: ignore
          retention-days: 7
