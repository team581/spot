name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - run: pnpm check
      - parallel:
          - run: pnpm format
          - run: pnpm lint
          - run: pnpm knip
      - run: pnpm build
      - run: pnpm build:jetson
      - run: pnpm test
      - uses: actions/upload-artifact@v7
        with:
          name: jetson-docs
          path: dist/jetson-docs
          if-no-files-found: error
          retention-days: 1

  application:
    name: Python and CPU native module
    needs: javascript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: jetson-docs
          path: dist/jetson-docs
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: '3.12'
          version: '0.13.6'
      - uses: jdx/mise-action@v5
        with:
          install: false
      - run: mise run check:application
