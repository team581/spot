name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  nix:
    name: Nix package (${{ matrix.system }})
    strategy:
      matrix:
        include:
          - runner: blacksmith-4vcpu-ubuntu-2404
            system: x86_64-linux
          - runner: blacksmith-4vcpu-ubuntu-2404-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Refresh pnpm dependency cache hash
        run: bash tools/update-pnpm-deps-hash.sh
      - run: nix flake check path:. --all-systems --no-build
      - run: nix fmt -- --check flake.nix nix/*.nix nix/hosts/spot/*.nix
      - run: nix build path:.#checks.${{ matrix.system }}.application -L --cores 2 --max-jobs 2

  javascript:
    name: JavaScript and documentation
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          cache: true
      - run: pnpm check
      - parallel:
          - run: pnpm format
          - run: pnpm lint
          - run: pnpm knip
      - run: pnpm build
      - run: pnpm build:jetson
      - run: pnpm test
      - uses: actions/upload-artifact@v7
        with:
          name: web-assets
          path: |
            dist/jetson-docs
            dist/dashboard
          if-no-files-found: error
          retention-days: 1

  application:
    name: Python application and CUDA geometry
    needs: javascript
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-assets
          path: dist
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: '3.12'
          version: '0.13.6'
      - uses: jdx/mise-action@v5
        with:
          install: false
      - run: mise run check:application
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          cache: true
      - run: pnpm --filter spot-dashboard exec playwright install --with-deps chromium
      - run: pnpm --filter spot-dashboard test:browser
