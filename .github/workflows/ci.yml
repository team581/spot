name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hooks:
    name: Hook configuration
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 5
    steps:
      - uses: useblacksmith/checkout@v1.8.2
      - uses: jdx/mise-action@v5.2.8
        with:
          install_args: hk pkl
      - run: hk check --all --step pkl-format
      - run: hk validate

  nix:
    name: Nix package (aarch64-linux)
    concurrency:
      group: nix-cache-${{ github.repository }}-aarch64-linux
      queue: max
    runs-on: blacksmith-4vcpu-ubuntu-2604-arm
    timeout-minutes: 30
    steps:
      - uses: useblacksmith/checkout@v1.8.2
      - name: Mount Nix cache
        uses: useblacksmith/stickydisk@v1.7.2
        with:
          key: ${{ github.repository }}-nix-cache-aarch64-linux
          path: /nix
          commit: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
      - name: Prepare Nix installation
        # Recreate host services on each runner while preserving the cached store and database.
        run: sudo rm -f /nix/receipt.json
      - uses: DeterminateSystems/nix-installer-action@v23
        id: nix
        with:
          # Persistent result roots retain the tools needed for incremental builds.
          extra-conf: |
            keep-derivations = true
            keep-outputs = true
      - run: nix flake check path:. --all-systems --no-build
      - run: nix fmt -- --check flake.nix nix/*.nix nix/hosts/spot/*.nix nix/hardware/j401/*.nix
      - name: Build application
        run: |
          root=/nix/var/nix/gcroots/spot-ci/application
          sudo install -d -o "$(id -u)" -g "$(id -g)" "$(dirname "$root")"
          nix build path:.#checks.aarch64-linux.application -L --cores 2 --max-jobs 2 --out-link "$root"
      - name: Stop Nix before unmounting the cache
        if: ${{ always() && steps.nix.outcome == 'success' }}
        run: sudo systemctl stop nix-daemon.socket determinate-nixd.socket nix-daemon.service

  javascript:
    name: JavaScript and documentation
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 10
    steps:
      - uses: useblacksmith/checkout@v1.8.2
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
      - run: pnpm check
      - parallel:
          - run: pnpm format
          - run: pnpm lint
          - run: pnpm knip
      - run: pnpm build
      - name: Package VS Code extension
        run: pnpm --filter spot-camera-preview package
      - run: pnpm build:jetson
      - run: pnpm test
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: web-assets
          path: |
            dist/jetson-docs
            dist/dashboard
          if-no-files-found: error
          retention-days: 1

  application:
    name: Rust application
    concurrency:
      group: opencv-cache-${{ github.repository }}-x86_64-linux
      queue: max
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 15
    steps:
      - uses: useblacksmith/checkout@v1.8.2
      - uses: jdx/mise-action@v5.2.8
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: apps/vision
      - run: sudo apt-get install -y libclang-dev pkg-config
      - name: Mount OpenCV cache
        uses: useblacksmith/stickydisk@v1.7.2
        with:
          key: ${{ github.repository }}-opencv-cache-x86_64-linux
          path: /nix
          commit: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
      - name: Prepare Nix installation
        run: sudo rm -f /nix/receipt.json
      - uses: DeterminateSystems/nix-installer-action@v23
        id: nix
        with:
          extra-conf: |
            keep-derivations = true
            keep-outputs = true
      - name: Install OpenCV
        run: |
          root=/nix/var/nix/gcroots/spot-ci/opencv
          sudo install -d -o "$(id -u)" -g "$(id -g)" "$(dirname "$root")"
          nix build path:.#opencv --cores 4 --max-jobs 2 --out-link "$root"
          echo "PKG_CONFIG_PATH=$root/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$root/lib" >> "$GITHUB_ENV"
      - run: cargo fmt --manifest-path apps/vision/Cargo.toml --check
      - run: cargo clippy --manifest-path apps/vision/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path apps/vision/Cargo.toml --locked
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
      - name: Check generated API types and config schema
        run: |
          pnpm --filter spot-dashboard generate:api
          pnpm --filter spot-docs generate:schema
          git diff --exit-code apps/dashboard/src/api.gen.ts apps/docs/public/spot-config.schema.json
      - name: Garbage collect the OpenCV cache
        if: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
        run: sudo "$(command -v nix-store)" --gc
      - name: Stop Nix before unmounting the cache
        if: ${{ always() && steps.nix.outcome == 'success' }}
        run: sudo systemctl stop nix-daemon.socket determinate-nixd.socket nix-daemon.service

  java:
    name: Java client
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 10
    steps:
      - uses: useblacksmith/checkout@v1.8.2
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6.4.1
      - run: ./gradlew build plainJavadocJar generatePomFileForMavenPublication
