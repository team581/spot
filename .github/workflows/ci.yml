name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hooks:
    name: Hook configuration
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 5
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: jdx/mise-action@v5
        with:
          install_args: hk pkl
      - run: hk check --all --step pkl-format
      - run: hk validate

  nix:
    name: Nix package (aarch64-linux)
    concurrency:
      group: nix-cache-${{ github.repository }}-aarch64-linux
      queue: max
    runs-on: blacksmith-4vcpu-ubuntu-2604-arm
    timeout-minutes: 30
    steps:
      - uses: useblacksmith/checkout@v1
      - name: Mount Nix cache
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-nix-cache-aarch64-linux
          path: /nix
          commit: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
      - name: Prepare Nix installation
        # Recreate host services on each runner while preserving the cached store and database.
        run: sudo rm -f /nix/receipt.json
      - uses: DeterminateSystems/nix-installer-action@v23
        id: nix
        with:
          # Persistent result roots retain the tools needed for incremental builds.
          extra-conf: |
            keep-derivations = true
            keep-outputs = true
      - run: nix flake check path:. --all-systems --no-build
      - run: nix fmt -- --check flake.nix nix/*.nix nix/hosts/spot/*.nix nix/hardware/j401/*.nix
      - name: Build application
        run: |
          root=/nix/var/nix/gcroots/spot-ci/application
          sudo install -d -o "$(id -u)" -g "$(id -g)" "$(dirname "$root")"
          nix build path:.#checks.aarch64-linux.application -L --cores 2 --max-jobs 2 --out-link "$root"
      - name: Stop Nix before unmounting the cache
        if: ${{ always() && steps.nix.outcome == 'success' }}
        run: sudo systemctl stop nix-daemon.socket determinate-nixd.socket nix-daemon.service

  javascript:
    name: JavaScript and documentation
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 10
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
      - run: pnpm check
      - parallel:
          - run: pnpm format
          - run: pnpm lint
          - run: pnpm knip
      - run: pnpm build
      - run: pnpm build:jetson
      - run: pnpm test
      - uses: actions/upload-artifact@v7
        with:
          name: web-assets
          path: |
            dist/jetson-docs
            dist/dashboard
          if-no-files-found: error
          retention-days: 1

  application:
    name: Python application and CUDA geometry
    needs: javascript
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 10
    env:
      # The setup actions manage these tools; mise only runs the application checks.
      MISE_DISABLE_TOOLS: uv
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: actions/download-artifact@v8
        with:
          name: web-assets
          path: dist
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          version-file: .tool-versions
      - uses: jdx/mise-action@v5
        with:
          install: false
      - run: mise run check:application
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
      - name: Check generated API types and config schema
        run: |
          pnpm --filter spot-dashboard generate:api
          pnpm --filter spot-docs generate:schema
          git diff --exit-code apps/dashboard/src/api.gen.ts apps/docs/public/spot-config.schema.json
      - name: Mount Playwright browsers
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-playwright-browsers-ubuntu-2604-${{ runner.arch }}
          path: ~/.cache/ms-playwright
          commit: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
      - run: pnpm --filter spot-dashboard exec playwright install --with-deps chromium
      - run: pnpm --filter spot-dashboard test:browser
      - name: Upload browser test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-browser-results
          path: apps/dashboard/test-results
          if-no-files-found: ignore
          retention-days: 7
