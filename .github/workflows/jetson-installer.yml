name: Jetson offline installer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jetson-installer
  cancel-in-progress: false

jobs:
  installer:
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    timeout-minutes: 180
    env:
      CLOUDFLARE_ACCOUNT_ID: 8bb70056a503857d02b48fc5db648f61
      R2_BUCKET: spot-jetson-images
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          persist-credentials: false
      - name: Check upload credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          : "${AWS_ACCESS_KEY_ID:?Set the R2_ACCESS_KEY_ID repository secret}"
          : "${AWS_SECRET_ACCESS_KEY:?Set the R2_SECRET_ACCESS_KEY repository secret}"
      - name: Mount Nix cache
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-nix-cache-aarch64-linux
          path: /nix
          commit: ${{ github.ref_name == github.event.repository.default_branch }}
      - name: Prepare Nix installation
        run: sudo rm -f /nix/receipt.json
      - uses: DeterminateSystems/nix-installer-action@v23
        id: nix
      - name: Refresh pnpm dependency cache hash
        run: bash tools/update-pnpm-deps-hash.sh
      - name: Build offline installer
        run: nix build path:.#packages.aarch64-linux.installer -L --cores 2 --max-jobs 2
      - name: Upload latest installer
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: nix shell --inputs-from path:. nixpkgs#awscli2 --command bash tools/upload-jetson-installer.sh
      - name: Share private download links
        uses: actions/upload-artifact@v7
        with:
          name: installer-downloads
          path: dist/installer/downloads.html
          if-no-files-found: error
          retention-days: 7
      - name: Stop Nix before unmounting the cache
        if: ${{ always() && steps.nix.outcome == 'success' }}
        run: sudo systemctl stop nix-daemon.socket determinate-nixd.socket nix-daemon.service
