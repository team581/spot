name: Jetson offline installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Bot pushes must not cancel a human-authored build on the same branch.
  group: jetson-installer-${{ github.ref }}-${{ endsWith(github.event.head_commit.author.username, '[bot]') || endsWith(github.event.head_commit.author.name, '[bot]') }}
  cancel-in-progress: true

jobs:
  installer:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (!endsWith(github.event.head_commit.author.username, '[bot]') &&
           !endsWith(github.event.head_commit.author.name, '[bot]')) }}
    runs-on: blacksmith-8vcpu-ubuntu-2604-arm
    timeout-minutes: 180
    concurrency:
      group: nix-cache-${{ github.repository }}-aarch64-linux
      queue: max
    env:
      CLOUDFLARE_ACCOUNT_ID: 8bb70056a503857d02b48fc5db648f61
      R2_BUCKET: spot-jetson-images
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          persist-credentials: false
      - name: Mount Nix cache
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-nix-cache-aarch64-linux
          path: /nix
          commit: ${{ github.ref_name == github.event.repository.default_branch }}
      - name: Prepare Nix installation
        run: sudo rm -f /nix/receipt.json
      - uses: DeterminateSystems/nix-installer-action@v23
        id: nix
        with:
          extra-conf: |
            keep-derivations = true
            keep-outputs = true
      - name: Build offline installer
        run: |
          root=/nix/var/nix/gcroots/spot-ci/installer
          sudo install -d -o "$(id -u)" -g "$(id -g)" "$(dirname "$root")"
          nix build path:.#packages.aarch64-linux.installer -L --cores 8 --max-jobs 2 --out-link "$root"
          ln -sfn "$root" result
      - name: Upload latest installer
        if: ${{ github.ref_name == github.event.repository.default_branch }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: nix shell --inputs-from path:. nixpkgs#awscli2 --command bash tools/upload-jetson-installer.sh
      - name: Share private download links
        if: ${{ github.ref_name == github.event.repository.default_branch }}
        uses: actions/upload-artifact@v7
        with:
          name: installer-downloads
          path: dist/installer/downloads.html
          if-no-files-found: error
          retention-days: 7
      - name: Share branch installer
        if: ${{ github.ref_name != github.event.repository.default_branch }}
        uses: actions/upload-artifact@v7
        with:
          name: spot-installer
          path: result/iso/*.iso
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Garbage collect the Nix cache
        if: ${{ github.ref_name == github.event.repository.default_branch }}
        run: |
          df -h /nix
          sudo "$(command -v nix-store)" --gc
          df -h /nix
      - name: Stop Nix before unmounting the cache
        if: ${{ always() && steps.nix.outcome == 'success' }}
        run: sudo systemctl stop nix-daemon.socket determinate-nixd.socket nix-daemon.service
