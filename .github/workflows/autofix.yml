name: autofix.ci

on: [push, pull_request]

permissions:
  contents: read

jobs:
  autofix:
    name: Autofix
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          cache: true
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: '3.12'
          version: '0.13.6'
      - run: uv sync --locked --no-install-workspace
      - run: pnpm --filter spot-docs exec astro sync
      - run: pnpm format:fix
        continue-on-error: true
      - run: pnpm lint:fix
        continue-on-error: true
      - run: uv run --no-sync ruff check --fix
        continue-on-error: true
      - run: uv run --no-sync ruff format
        continue-on-error: true
      - name: Refresh pnpm dependency cache hash
        run: bash tools/update-pnpm-deps-hash.sh
      - name: Run autofix.ci
        uses: autofix-ci/action@v1
