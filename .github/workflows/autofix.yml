name: autofix.ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  autofix:
    name: Autofix
    runs-on: blacksmith-4vcpu-ubuntu-2604-arm
    timeout-minutes: 15
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: jdx/mise-action@v5
        with:
          install_args: hk pkl
      - run: hk fix --all --step pkl-format
        continue-on-error: true
      - run: hk validate
        continue-on-error: true
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          version-file: .tool-versions
      - run: uv sync --locked --no-install-workspace
      - run: pnpm --filter spot-docs exec astro sync
      - run: pnpm format:fix
        continue-on-error: true
      - run: pnpm lint:fix
        continue-on-error: true
      - run: uv run --no-sync ruff check --fix
        continue-on-error: true
      - run: uv run --no-sync ruff format
        continue-on-error: true
      - name: Run autofix.ci
        uses: autofix-ci/action@v1
