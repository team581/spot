name: autofix.ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  autofix:
    name: Autofix
    concurrency:
      group: opencv-cache-${{ github.repository }}-aarch64-linux
      queue: max
    runs-on: blacksmith-4vcpu-ubuntu-2604-arm
    timeout-minutes: 15
    steps:
      - uses: useblacksmith/checkout@v1.8.2
      - uses: jdx/mise-action@v5.2.8
        with:
          install_args: hk pkl rust
      - run: hk fix --all --step pkl-format
        continue-on-error: true
      - run: hk validate
        continue-on-error: true
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
      - run: sudo apt-get install -y libclang-dev pkg-config
      - name: Mount OpenCV cache
        uses: useblacksmith/stickydisk@v1.7.2
        with:
          key: ${{ github.repository }}-opencv-cache-aarch64-linux
          path: /nix
          commit: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
      - name: Prepare Nix installation
        run: sudo rm -f /nix/receipt.json
      - uses: DeterminateSystems/nix-installer-action@v23
        id: nix
        with:
          extra-conf: |
            keep-derivations = true
            keep-outputs = true
      - name: Install OpenCV
        run: |
          root=/nix/var/nix/gcroots/spot-ci/opencv
          sudo install -d -o "$(id -u)" -g "$(id -g)" "$(dirname "$root")"
          nix build path:.#opencv --cores 4 --max-jobs 2 --out-link "$root"
          echo "PKG_CONFIG_PATH=$root/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$root/lib" >> "$GITHUB_ENV"
      - run: pnpm --filter spot-docs exec astro sync
      - run: pnpm --filter spot-dashboard generate:api
        continue-on-error: true
      - run: pnpm --filter spot-docs generate:schema
        continue-on-error: true
      - run: pnpm format:fix
        continue-on-error: true
      - run: pnpm lint:fix
        continue-on-error: true
      - run: cargo fmt --manifest-path apps/vision/Cargo.toml
        continue-on-error: true
      - name: Run autofix.ci
        uses: autofix-ci/action@v1.3.4
      - name: Garbage collect the OpenCV cache
        if: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
        run: sudo "$(command -v nix-store)" --gc
      - name: Stop Nix before unmounting the cache
        if: ${{ always() && steps.nix.outcome == 'success' }}
        run: sudo systemctl stop nix-daemon.socket determinate-nixd.socket nix-daemon.service
