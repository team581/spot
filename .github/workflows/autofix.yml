name: autofix.ci

on: [push, pull_request]

permissions:
  contents: read

jobs:
  autofix:
    name: Autofix
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 15
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: jdx/mise-action@v5
        with:
          install_args: hk pkl
      - run: hk fix --all --step pkl-format
        continue-on-error: true
      - run: hk validate
        continue-on-error: true
      - name: Mount Nix cache
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-nix-cache-x86_64-linux
          path: /nix
          commit: 'false'
      - name: Prepare Nix installation
        # Recreate host services on each runner while preserving the cached store and database.
        run: sudo rm -f /nix/receipt.json
      - uses: DeterminateSystems/nix-installer-action@v23
        id: nix
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          version-file: .tool-versions
      - run: uv sync --locked --no-install-workspace
      - run: pnpm --filter spot-docs exec astro sync
      - run: pnpm format:fix
        continue-on-error: true
      - run: pnpm lint:fix
        continue-on-error: true
      - run: uv run --no-sync ruff check --fix
        continue-on-error: true
      - run: uv run --no-sync ruff format
        continue-on-error: true
      - name: Refresh pnpm dependency cache hash
        run: bash tools/update-pnpm-deps-hash.sh
      - name: Run autofix.ci
        uses: autofix-ci/action@v1
      - name: Stop Nix before unmounting the cache
        if: ${{ always() && steps.nix.outcome == 'success' }}
        run: sudo systemctl stop nix-daemon.socket determinate-nixd.socket nix-daemon.service
