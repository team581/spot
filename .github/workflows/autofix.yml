name: autofix.ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  autofix:
    name: Autofix
    runs-on: blacksmith-4vcpu-ubuntu-2604-arm
    timeout-minutes: 15
    steps:
      - uses: useblacksmith/checkout@v1.8.2
      - uses: jdx/mise-action@v5.2.8
        with:
          install_args: hk pkl rust
      - run: hk fix --all --step pkl-format
        continue-on-error: true
      - run: hk validate
        continue-on-error: true
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
      - run: sudo apt-get install -y libclang-dev libopencv-dev
      - run: pnpm --filter spot-docs exec astro sync
      - run: pnpm --filter spot-dashboard generate:api
        continue-on-error: true
      - run: pnpm --filter spot-docs generate:schema
        continue-on-error: true
      - run: pnpm format:fix
        continue-on-error: true
      - run: pnpm lint:fix
        continue-on-error: true
      - run: cargo fmt --manifest-path apps/vision/Cargo.toml
        continue-on-error: true
      - name: Run autofix.ci
        uses: autofix-ci/action@v1.3.4
