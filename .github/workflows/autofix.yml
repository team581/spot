name: autofix.ci

on: [push, pull_request]

permissions:
  contents: read

jobs:
  autofix:
    name: Autofix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          cache: true
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: '3.12'
          version: '0.13.6'
      - run: uv sync --locked --no-install-workspace
      - run: pnpm --filter spot-docs exec astro sync
      - run: pnpm format:fix
        continue-on-error: true
      - run: pnpm lint:fix
        continue-on-error: true
      - run: uv run --no-sync ruff check --fix
        continue-on-error: true
      - run: uv run --no-sync ruff format
        continue-on-error: true
      - name: Run autofix.ci
        uses: autofix-ci/action@v1
