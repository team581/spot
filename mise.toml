[tools]
hk = "2.12.0"
java = "temurin-21"
pkl = "0.32.2"
rust = { version = "1.99.1", components = "clippy,rustfmt" }

[settings]
idiomatic_version_file_enable_tools = ["node", "pnpm"]

[tasks.setup]
description = "Install the JS workspace, bundle the dashboard and docs, and build the vision service"
run = [
  "pnpm install --frozen-lockfile",
  "pnpm build",
  "pnpm build:jetson",
  "cargo build --manifest-path apps/vision/Cargo.toml",
  "hk install --mise",
]

[tasks.dev]
description = "Run the dashboard with the regression images as cameras"
depends = ["dev:backend", "dev:dashboard"]

[tasks."dev:backend"]
description = "Run the vision service with the regression images as cameras"
run = """
cargo run --manifest-path apps/vision/Cargo.toml -- run --state-dir .spot-dev \
  --listen 127.0.0.1:5808 --replay apps/vision/tests/data/regression --docs-dir dist/jetson-docs
"""

[tasks."dev:dashboard"]
description = "Run the dashboard development server"
env = { SPOT_BACKEND = "http://127.0.0.1:5808" }
run = "pnpm --filter spot-dashboard dev"

[tasks."dev:jetson"]
description = "Run the dashboard development server against Spot's vision service"
run = "SPOT_BACKEND=http://${SPOT_HOST:-10.5.81.11}:5800 pnpm --filter spot-dashboard dev"

[tasks."jetson:ssh"]
description = "SSH to Spot using the repository's shared maintenance key"
run = "bash tools/jetson-ssh.sh"

[tasks."jetson:deploy"]
description = "Build and test a NixOS generation on Spot without changing its boot default"
run = "nix run .#deploy -- test"

[tasks."jetson:installer"]
description = "Build the ARM64 installer and copy the ISO to dist/installer"
run = """
if [ "$(uname)" = Darwin ]; then bash tools/linux-builder.sh; fi
iso=$(nix build -L --no-link --print-out-paths path:.#packages.aarch64-linux.installer)
mkdir -p dist/installer
install -m 644 "$iso"/iso/*.iso dist/installer/spot-installer.iso
"""

[tasks."linux-builder"]
description = "Start the VM that builds Linux outputs on macOS"
run = "bash tools/linux-builder.sh"

[tasks."linux-builder:setup"]
description = "Configure Nix on macOS to build Linux outputs with the linux-builder VM"
run = "bash tools/linux-builder-setup.sh"

[tasks."linux-builder:stop"]
description = "Shut down the linux-builder VM"
run = "bash tools/linux-builder.sh stop"

[tasks.format]
run = [
  "pnpm format",
  "cargo fmt --manifest-path apps/vision/Cargo.toml --check",
  "./gradlew spotlessCheck",
]

[tasks."format:fix"]
run = [
  "pnpm format:fix",
  "cargo fmt --manifest-path apps/vision/Cargo.toml",
  "./gradlew spotlessApply",
]

[tasks.lint]
run = [
  "pnpm lint",
  "pnpm knip",
  "cargo clippy --manifest-path apps/vision/Cargo.toml --all-targets -- -D warnings",
]

[tasks."lint:fix"]
run = ["pnpm lint:fix", "cargo clippy --manifest-path apps/vision/Cargo.toml --all-targets --fix --allow-dirty"]

[tasks.typecheck]
run = ["pnpm check"]

[tasks.test]
run = [
  "cargo test --manifest-path apps/vision/Cargo.toml",
  "pnpm test",
  "./gradlew test",
]
