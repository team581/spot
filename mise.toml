[tools]
hk = "2.12.0"
pkl = "0.32.2"
rust = { version = "1.99.1", components = "clippy,rustfmt" }

[settings]
idiomatic_version_file_enable_tools = ["node", "pnpm"]

[tasks.setup]
description = "Install the JS workspace, bundle the dashboard and docs, and build the vision service"
run = [
  "pnpm install --frozen-lockfile",
  "pnpm build",
  "pnpm build:jetson",
  "nix develop -c cargo build --manifest-path apps/vision/Cargo.toml",
  "hk install --mise",
]

[tasks.dev]
description = "Run the dashboard with the regression images as cameras"
depends = ["dev:backend", "dev:dashboard"]

[tasks."dev:backend"]
description = "Run the vision service with the regression images as cameras"
run = """
nix develop -c cargo run --manifest-path apps/vision/Cargo.toml -- run --state-dir .spot-dev \
  --listen 127.0.0.1:5808 --replay apps/vision/tests/data/regression --docs-dir dist/jetson-docs
"""

[tasks."dev:dashboard"]
description = "Run the dashboard development server"
env = { SPOT_BACKEND = "http://127.0.0.1:5808" }
run = "pnpm --filter spot-dashboard dev"

[tasks."dev:jetson"]
description = "Run the dashboard development server against Spot's vision service"
run = "SPOT_BACKEND=http://${SPOT_HOST:-10.5.81.11}:5800 pnpm --filter spot-dashboard dev"

[tasks."jetson:ssh"]
description = "SSH to Spot using the repository's shared maintenance key"
run = "bash tools/jetson-ssh.sh"

[tasks."jetson:deploy"]
description = "Build and test a NixOS generation on Spot without changing its boot default"
run = "nix run .#deploy -- test"

[tasks."jetson:installer"]
description = "Build the ARM64 installer in Docker and export the ISO to dist/installer"
run = """
docker buildx build --platform linux/arm64 \\
  --file tools/jetson-installer.Dockerfile \\
  --output type=local,dest=dist/installer .
"""

[tasks.format]
run = ["pnpm format", "cargo fmt --manifest-path apps/vision/Cargo.toml --check"]

[tasks."format:fix"]
run = ["pnpm format:fix", "cargo fmt --manifest-path apps/vision/Cargo.toml"]

[tasks.lint]
run = [
  "pnpm lint",
  "pnpm knip",
  "nix develop -c cargo clippy --manifest-path apps/vision/Cargo.toml --all-targets -- -D warnings",
]

[tasks."lint:fix"]
run = ["pnpm lint:fix", "nix develop -c cargo clippy --manifest-path apps/vision/Cargo.toml --all-targets --fix --allow-dirty"]

[tasks.typecheck]
run = ["pnpm check"]

[tasks.test]
run = ["nix develop -c cargo test --manifest-path apps/vision/Cargo.toml", "pnpm test"]
