[tools]
hk = "2.11.1"
pkl = "0.31.1"

[settings]
idiomatic_version_file_enable_tools = ["node", "pnpm"]

[tasks.setup]
description = "Install the JS workspace, bundle the dashboard and docs, and install the CPU detector"
run = [
  "pnpm install --frozen-lockfile",
  "pnpm build",
  "pnpm build:jetson",
  "uv sync --locked --extra nt --extra systemd -Ccmake.define.SPOT_BUILD_CUDA=OFF",
  "hk install --mise",
]

[tasks.dev]
description = "Run the dashboard with synthetic cameras at http://127.0.0.1:5815"
depends = ["dev:backend", "dev:dashboard"]

[tasks."dev:backend"]
description = "Run the synthetic vision backend without hardware"
run = "uv run --no-sync python apps/vision/tools/ui_fixture.py --port 5808"

[tasks."dev:dashboard"]
description = "Run the dashboard development server"
env = { SPOT_BACKEND = "http://127.0.0.1:5808" }
run = "pnpm --filter spot-dashboard dev"

[tasks."jetson:ssh"]
description = "SSH to Spot using the repository's shared maintenance key"
run = "bash tools/jetson-ssh.sh"

[tasks."jetson:deploy"]
description = "Build and test a NixOS generation on Spot without changing its boot default"
run = "nix run .#deploy -- test"

[tasks."jetson:installer"]
description = "Build the ARM64 installer in Docker and export the ISO to dist/installer"
run = """
docker buildx build --platform linux/arm64 \\
  --file tools/jetson-installer.Dockerfile \\
  --output type=local,dest=dist/installer .
"""

[tasks.format]
run = ["pnpm format", "uv run --no-sync ruff format --check"]

[tasks."format:fix"]
run = ["pnpm format:fix", "uv run --no-sync ruff format"]

[tasks.lint]
run = ["pnpm lint", "pnpm knip", "uv run --no-sync ruff check", "uv run --no-sync vulture"]

[tasks.deadcode]
description = "Check Python dead code against the existing Vulture baseline"
run = "uv run --no-sync vulture"

[tasks."lint:fix"]
run = ["pnpm lint:fix", "uv run --no-sync ruff check --fix"]

[tasks.typecheck]
run = ["pnpm check", "uv run --no-sync ty check"]

[tasks.test]
run = ["uv run --no-sync pytest", "pnpm test"]

[tasks."check:application"]
description = "Run CPU application checks and native CUDA geometry regressions"
run = [
  "uv sync --locked --extra nt --extra systemd -Ccmake.define.SPOT_BUILD_DIAGNOSTICS=ON",
  "uv run --no-sync ruff format --check",
  "uv run --no-sync ruff check",
  "uv run --no-sync vulture",
  "uv run --no-sync ty check",
  "uv run --no-sync pytest",
  "uv build --package spot-vision --wheel --out-dir dist/wheels -Ccmake.define.SPOT_BUILD_CUDA=OFF",
  "uv run --no-sync python apps/vision/tests/installed_service.py dist/wheels",
]
