[package]
name = "spot-vision"
version = "0.2.1"
edition = "2024"
description = "Jetson AprilTag vision service for Team 581"
license = "MIT"
publish = false
default-run = "spot-vision"

[features]
# NVJPG decoding and the Team 766 / FRC 971 CUDA detector. Requires the Jetson Multimedia API and CUDA.
jetson = []

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
nalgebra = "0.35"
rmpv = "1"
schemars = "1"
sd-notify = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs", "process", "io-util"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
toml = "1"
toml_edit = "0.25"
tower-http = { version = "0.7", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "6", features = ["axum_extras"] }
utoipa-axum = "0.3"
zune-jpeg = "0.5.15"
zune-core = "0.5"
foxglove = { version = "0.30", default-features = false, features = ["websocket"] }
mcap = { version = "0.26", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
v4l = "0.14"

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
debug = "line-tables-only"
# A bug that panics restarts the service (systemd) instead of silently stopping a thread.
panic = "abort"
