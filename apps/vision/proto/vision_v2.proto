syntax = "proto3";

package spot.vision.v2;
option java_package = "frc.robot.vision.generated";
option java_outer_classname = "SpotProtos";

// Coordinates: WPILib NWU, metres, quaternion WXYZ. Poses are field-to-camera;
// robot owns capture-time mount transforms and candidate selection.
message Pose {
  double x_m = 1;
  double y_m = 2;
  double z_m = 3;
  double qw = 4;
  double qx = 5;
  double qy = 6;
  double qz = 7;
}
message OpticalMode {
  string id = 1;
  uint32 width = 2;
  uint32 height = 3;
  string pixel_format = 4;
  uint32 fps = 5;
  // Changes when crop/binning/lens/focus changes; matching dimensions alone
  // never establish calibration compatibility.
  string optical_signature = 6;
}
message ControlPolicy {
  string name = 1;
  double default_value = 2;
  bool allow_override = 3;
  bool required = 4;
}
message CameraDefinition {
  string name = 1;
  bool required = 2;
  bool enabled = 3;
  Pose robot_to_camera = 4;
  uint32 image_rotation_deg = 5;
  repeated OpticalMode allowed_modes = 6;
  repeated ControlPolicy controls = 7;
  bool moving_mount = 8;
  string joint_name = 9;
}
message FieldTag { uint32 id = 1; Pose field_to_tag = 2; double size_m = 3; }
message FieldLayout {
  string origin = 1;
  double length_m = 2;
  double width_m = 3;
  repeated FieldTag tags = 4;
}
// Complete robot-owned content; SHA-256 of serialized Profile (no maps).
// Repeated fields retain their explicit order. No JSON float canonicalization.
message Profile {
  uint32 schema_version = 1;
  string robot_id = 2;
  repeated CameraDefinition cameras = 3;
  FieldLayout field = 4;
  bool fusion_enabled = 5;
  bool heading_enabled = 6;
  bool revised_trust_enabled = 7;
  double max_age_s = 8;
  double future_tolerance_s = 9;
  double reorder_window_s = 10;
}
message Manifest {
  Profile profile = 1;
  string robot_session = 2;
  string manifest_hash = 3;
}
// Disabled state must be refreshed; stale/offline never unlocks mutations.
message RobotState {
  string robot_session = 1;
  bool enabled = 2;
  uint64 sequence = 3;
  // Global enabled-time processing policy, scoped to robot_session.
  uint64 tag_selection_generation = 4;
  repeated uint32 allowed_tag_ids = 5;
}
message CameraGeneration {
  string camera_name = 1;
  string binding_id = 2;
  uint64 binding_generation = 3;
  string calibration_hash = 4;
  string mode_id = 5;
  string optical_signature = 6;
  bool calibration_valid = 7;
}
message Acknowledgement {
  uint32 schema_version = 1;
  string robot_id = 2;
  string robot_session = 3;
  string manifest_hash = 4;
  string service_session = 5;
  uint64 connection_epoch = 6;
  uint64 sync_epoch = 7;
  string runtime_generation = 8;
  string field_hash = 9;
  repeated CameraGeneration cameras = 10;
  bool applied = 11;
  string error = 12;
  bool tag_selection_supported = 13;
}
message PoseCandidate {
  enum Method { UNKNOWN = 0; MULTI_TAG_SQPNP = 1; SINGLE_TAG_IPPE_SQUARE = 2; }
  Pose field_to_camera = 1;
  Method method = 2;
  repeated uint32 tag_ids = 3;
  // RMS Euclidean image-corner residual, in delivered-image pixels.
  double reprojection_error_px = 4;
  double average_tag_distance_m = 5;
  double image_area_fraction = 6;
  double image_spread_fraction = 7;
  // Lens-correction displacement, not residual lens error; diagnostic only.
  double distortion_displacement_px = 8;
}
message TagObservation {
  uint32 id = 1;
  repeated double corners_xy_px = 2;
  int32 hamming = 3;
  double decision_margin = 4;
  bool used_for_pose = 5;
  string rejection_reason = 6;
  optional double distortion_displacement_px = 7;
}
message ProcessingTiming {
  double capture_to_detect_ms = 1;
  double detect_ms = 2;
  double solve_ms = 3;
  double total_ms = 4;
}
message Observation {
  uint32 schema_version = 1;
  string robot_id = 2;
  string robot_session = 3;
  string service_session = 4;
  string capture_epoch = 5;
  uint64 connection_epoch = 6;
  uint64 sync_epoch = 7;
  uint64 sequence = 8;
  string camera_name = 9;
  string binding_id = 10;
  uint64 binding_generation = 11;
  string manifest_hash = 12;
  string field_hash = 13;
  string calibration_hash = 14;
  bool calibration_valid = 15;
  string runtime_generation = 16;
  string mode_id = 17;
  string optical_signature = 18;
  // Diagnostic local clock value; robot consumes the NT envelope's verified
  // server/FPGA timestamp. Do not add the server offset a second time.
  uint64 capture_local_nt_us = 19;
  string timestamp_source = 20;
  double timestamp_uncertainty_s = 21;
  repeated PoseCandidate candidates = 22;
  repeated TagObservation tags = 23;
  ProcessingTiming timing = 24;
  uint64 tag_selection_generation = 25;
}
message Health {
  uint32 schema_version = 1;
  string service_session = 2;
  uint64 sequence = 3;
  double uptime_s = 4;
  string sync_state = 5;
  sint64 offset_us = 6;
  double sync_update_age_s = 7;
  uint64 connection_epoch = 8;
  uint64 sync_epoch = 9;
  uint64 discontinuities = 10;
  string runtime_generation = 11;
  string release_id = 12;
  string native_hash = 13;
  repeated string faults = 14;
}
