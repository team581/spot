[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "spot-vision"
version = "0.2.1"
description = "Jetson AprilTag vision service for Team 581"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "napa-vision==0.5.1",
  "numpy>=1.26",
  "opencv-contrib-python-headless>=4.9",
  "robotpy-wpiutil>=2026.2.2,<2027",
  "robotpy-wpimath>=2026.2.2,<2027",
  "fastapi>=0.162.0",
  "uvicorn>=0.54.0",
]

[project.optional-dependencies]
nt = ["pyntcore>=2026.2.2,<2027"]
systemd = ["sdnotify>=0.3.2"]

[project.scripts]
spot-vision = "spot_vision.cli:main"

[tool.scikit-build]
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/spot_vision"]

[tool.scikit-build.cmake.define]
SPOT_BUILD_CUDA = "OFF"
SPOT_BUILD_DIAGNOSTICS = "OFF"

[tool.uv]
# Inputs are relative to this workspace member.
cache-keys = [
  { file = "pyproject.toml" },
  { file = "../../pyproject.toml" },
  { file = "CMakeLists.txt" },
  { file = "cpp/**/*" },
  { file = "src/spot_vision/**/*.py" },
  { file = "src/spot_vision/**/*.pyi" },
  { file = "../../dist/dashboard/**/*" },
  { git = { commit = true } },
  { file = "../../dist/jetson-docs/**/*" },
]
