<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spot | Camera calibration</title>
<style>
:root{font:15px system-ui,sans-serif;color:#e9eef5;background:#11161d;--line:#2a3542;--muted:#9da8b6;--blue:#54a7ff;--green:#55d49a;--amber:#f1bd62;--red:#ff7d7d}*{box-sizing:border-box}body{margin:0}.shell{max-width:1220px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}.eyebrow{color:var(--blue);font-weight:700;text-transform:uppercase;font-size:12px}h1{font-size:30px;margin:5px 0}h2{font-size:18px}.muted{color:var(--muted)}.steps{display:flex;gap:8px;margin-bottom:20px}.step{flex:1;border:1px solid var(--line);padding:12px;border-radius:7px}.step.active{border-color:var(--blue);background:#172638}.step.done{border-color:var(--green)}.step b{display:block}.layout{display:grid;grid-template-columns:1fr 320px;gap:18px}.panel{background:#171e27;border:1px solid var(--line);border-radius:8px;padding:18px}.cameras{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.camera{border:1px solid var(--line);border-radius:7px;overflow:hidden}.camera header,.camera .details{padding:12px}.camera header{display:flex;justify-content:space-between;align-items:start;gap:8px}.camera h3{margin:0}.view{position:relative;background:#090d11}.preview{display:block;width:100%;height:auto;min-height:120px}.guide{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.legend{font-size:12px;color:var(--amber);margin-top:8px}.status{font-size:12px;color:var(--amber);text-align:right}.status.good{color:var(--green)}.status.bad{color:var(--red)}.status.busy{color:var(--blue);font-weight:700}.status.busy::before{content:'';display:inline-block;width:10px;height:10px;margin-right:6px;border:2px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.status.busy::before{animation:none}}.meter{height:7px;background:#2b3540;border-radius:9px;overflow:hidden;margin:10px 0}.meter i{display:block;background:var(--blue);height:100%;width:var(--w)}.metrics{font-size:12px;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{margin-top:10px;flex:1;min-width:86px}label{display:block;color:var(--muted);font-size:12px;margin:14px 0 5px}input,select{width:100%;background:#0f141a;border:1px solid var(--line);color:inherit;padding:9px;border-radius:5px}button{border:0;border-radius:5px;padding:10px 14px;background:var(--blue);color:#07111d;font-weight:700;cursor:pointer;margin-top:16px}button:disabled{cursor:not-allowed;opacity:.5}.secondary{background:#293541;color:inherit}.save{background:var(--green)}.save.saved:disabled{opacity:1}.save.failed{background:var(--red)}.note{font-size:13px;line-height:1.5;border-left:3px solid var(--blue);padding-left:10px}.error{color:var(--red);min-height:20px;margin-top:12px}a{color:var(--blue)}@media(max-width:760px){.shell{padding:16px}.layout{grid-template-columns:1fr}.cameras{grid-template-columns:1fr}.steps{overflow:auto}.step{min-width:130px}.top{display:block}}
</style>
</head>
<body><main class="shell">
<div class="top"><div><div class="eyebrow"><a href="/">← Dashboard</a> / setup</div><h1>Four-camera calibration</h1></div><button class="secondary" id="reset">Reset session</button></div>
<nav class="steps"><div class="step active"><b>1 · Board</b><span class="muted">Set dimensions</span></div><div class="step"><b>2 · Capture</b><span class="muted">Guide the board</span></div><div class="step"><b>3 · Review</b><span class="muted">Check fit quality</span></div><div class="step"><b>4 · Save</b><span class="muted">Save results</span></div></nav>
<div class="layout"><section class="panel"><h2>Camera queue</h2><div class="cameras" id="cameras"></div></section>
<aside class="panel"><h2>Calibration settings</h2><label>Dictionary<select id="dict"><option selected>DICT_4X4_250</option><option>DICT_4X4_1000</option><option>DICT_4X4_100</option><option>DICT_4X4_50</option><option>DICT_5X5_100</option><option>DICT_6X6_250</option></select></label><label>Squares across<input type="number" id="sx" value="15" min="2"></label><label>Squares down<input type="number" id="sy" value="15" min="2"></label><label>Square length (m)<input type="number" id="sl" value="0.030" step="0.001"></label><label>Marker length (m)<input type="number" id="ml" value="0.022" step="0.001"></label><label>Distortion model<select id="model"><option value="plumb_bob">Plumb bob · 5 terms</option><option value="rational">Rational · 8 terms</option></select></label><label>Minimum quality frames<input type="number" id="minFrames" value="15" min="8" max="80"></label><button id="start">Start automatic capture</button><div class="error" id="error"></div></aside></div>
</main><script>
let cameras=[],sessionId=null,calibrationToken=null,running=false,lastStatus={};const root=document.querySelector('#cameras'),errorBox=document.querySelector('#error');
const escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function buildCards(){root.innerHTML=cameras.map(c=>`<article class="camera" data-camera="${escapeHtml(c.id)}"><header><h3>Camera ${escapeHtml(c.id)}</h3><div class="status" role="status" aria-live="polite">Connecting…</div></header><div class="view"><img class="preview" alt="Live calibration view from camera ${escapeHtml(c.id)}"><canvas class="guide" aria-label="Calibration coverage: yellow needs variety, green has varied views"></canvas></div><div class="details"><div class="meter" style="--w:0%"><i></i></div><div class="metrics">0 frames</div><div class="legend">Yellow: needs views · Green: complete</div><div class="actions"><button class="pause secondary" disabled>Pause</button><button class="capture" disabled>Capture view</button><button class="secondary compute" disabled>Calibrate</button><button class="save" aria-live="polite" disabled>Save</button><button class="restart secondary" disabled>Restart camera</button></div><div class="save-feedback error" role="status" aria-live="polite"></div></div></article>`).join('');root.querySelectorAll('.camera').forEach(card=>{const id=card.dataset.camera;card.querySelector('.pause').onclick=()=>action(id,card.dataset.running==='true'?'stop':'start');card.querySelector('.capture').onclick=()=>action(id,'capture');card.querySelector('.compute').onclick=()=>action(id,'compute');card.querySelector('.save').onclick=()=>action(id,'save');card.querySelector('.restart').onclick=()=>action(id,'restart')})}
const post=async(url,body={})=>{const response=await fetch(url,{method:'POST',signal:AbortSignal.timeout(30000),headers:{'Content-Type':'application/json','X-Calibration-Token':calibrationToken},body:JSON.stringify({...body,session_id:sessionId})});const data=await response.json();if(!response.ok)throw new Error(data.error||'calibration request failed');return data};
function showError(error){errorBox.textContent=error?.message||String(error)}
function drawGuide(card,state){
 const canvas=card.querySelector('.guide'),bounds=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
 canvas.width=Math.round(bounds.width*dpr);canvas.height=Math.round(bounds.height*dpr);
 const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
 for(const particle of state.coverage_particles||[]){
  const progress=Math.max(0,Math.min(1,particle.progress)),good=progress>=1;
  const x=particle.x*bounds.width,y=particle.y*bounds.height;
  // Fixed observed positions: a quiet constellation that stays registered to the feed.
  ctx.fillStyle=good?'rgba(85,230,155,.46)':`rgba(255,216,90,${.58+progress*.15})`;
  ctx.beginPath();ctx.arc(x,y,good?1.5:1.7,0,Math.PI*2);ctx.fill();
 }
 canvas.setAttribute('aria-label',`Calibration coverage: ${Math.round((state.coverage_good_fraction||0)*100)}% of regions have varied views`);
}
function savedKey(id){return `calibration-saved:${sessionId}:${id}`}
function clearSave(camera){camera.saveState=null;camera.saveError=null;try{localStorage.removeItem(savedKey(camera.id))}catch{}}
function restoreSave(camera,signature){try{return JSON.parse(localStorage.getItem(savedKey(camera.id)))===signature?'saved':null}catch{return null}}
function updateStatus(data){lastStatus=data;const states=Object.values(data.cameras||{});if(states.some(s=>s.calibrating||s.report)){document.querySelectorAll('.step')[2].className='step active';if(states.length===cameras.length&&states.every(s=>s.report&&!s.running))document.querySelectorAll('.step')[1].className='step done'}for(const camera of cameras){
 const state=data.cameras?.[camera.id]||{},card=root.querySelector(`[data-camera="${CSS.escape(camera.id)}"]`),frames=state.frames||0,coverage=Math.round((state.coverage_good_fraction||0)*100),progress=Math.round((state.coverage_progress||0)*100),report=state.report,busy=!!state.calibrating;
 const signature=report?JSON.stringify(report):null;
 if(camera.saveSignature!==signature||camera.saveSession!==sessionId){camera.saveState=report?.accepted?restoreSave(camera,signature):null;camera.saveSignature=signature;camera.saveSession=sessionId}
 if(busy||!report?.accepted){clearSave(camera)}
 card.dataset.running=String(!!state.running);drawGuide(card,state);
 card.querySelector('.meter').style.setProperty('--w',progress+'%');
 card.querySelector('.metrics').textContent=busy?'Solving camera calibration…':report?`${report.frames_used} frames · ${report.rms_reprojection_error_px?.toFixed(2)??'--'} px RMS · ${report.reason}`:`${frames} / ${minFrames.value} frames · ${coverage}% green · ${state.capture_reason||'Show the board'}`;if(camera.fps)card.querySelector('.metrics').textContent+=` · ${camera.fps.toFixed(0)} fps`;
 const status=card.querySelector('.status'),error=camera.previewError||state.error;
 status.textContent=camera.saving?'Saving…':busy?'Calibrating…':camera.saveState==='failed'?'Save failed':error||(camera.saveState==='saved'?'Saved':(report?.accepted?'Validated':report?'Needs more views':state.detected?(state.running?'Auto capture':'Paused'):state.running?'Find the board':camera.previewReady?'Live preview':'Connecting…'));
 status.className='status '+(busy||camera.saving?'busy':error||camera.saveState==='failed'?'bad':report?.accepted?'good':'');card.setAttribute('aria-busy',String(busy||camera.saving));
 card.querySelector('.capture').disabled=busy||camera.saving||!state.running||!state.detected||!!error;
 const pause=card.querySelector('.pause');pause.disabled=!sessionId||busy||camera.saving||!!report?.accepted;pause.textContent=state.running?'Pause':'Resume';
 card.querySelector('.compute').disabled=busy||camera.saving||frames<+minFrames.value;
 const save=card.querySelector('.save');save.disabled=busy||camera.saving||!report?.accepted||camera.saveState==='saved';save.textContent=camera.saving?'Saving…':camera.saveState==='saved'?'✓ Saved':camera.saveState==='failed'?'Retry save':'Save';save.className='save '+(camera.saveState||'');
 card.querySelector('.restart').disabled=!sessionId||busy||camera.saving;card.querySelector('.save-feedback').textContent=camera.saveState==='failed'?camera.saveError||'Save failed':'';
}if(cameras.length&&cameras.every(c=>c.saveState==='saved'))document.querySelectorAll('.step')[3].className='step done';else document.querySelectorAll('.step')[3].className='step';}
async function refreshCamera(camera){const image=root.querySelector(`[data-camera="${CSS.escape(camera.id)}"] .preview`);let previousTime=performance.now();while(running){try{const url=camera.previewUrl?`${camera.previewUrl}?after=${camera.revision||0}`:`/api/camera/${encodeURIComponent(camera.id)}/frame.jpg?t=${Date.now()}`;const response=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(10000)});if(response.status===204)continue;if(!response.ok){const data=await response.json();throw new Error(data.error||`Camera unavailable (${response.status})`)}const old=image.src,blob=await response.blob();image.src=URL.createObjectURL(blob);if(old.startsWith('blob:'))URL.revokeObjectURL(old);camera.revision=Number(response.headers.get('X-Revision'))||0;camera.previewReady=true;camera.previewError=null;const now=performance.now();camera.fps=camera.fps?camera.fps*.8+1000/(now-previousTime)*.2:1000/(now-previousTime);previousTime=now;if(!camera.previewUrl)await new Promise(resolve=>setTimeout(resolve,65))}catch(error){camera.previewError=['TimeoutError','AbortError'].includes(error.name)?'Preview delayed · retrying…':error.message||'Camera unavailable';await new Promise(resolve=>setTimeout(resolve,500))}}}
async function refresh(){while(running){try{const response=await fetch('/api/session/status',{cache:'no-store',signal:AbortSignal.timeout(30000)});if(!response.ok)throw new Error('Status unavailable · retrying…');const data=await response.json();if(data.session_id)sessionId=data.session_id;updateStatus(data);errorBox.textContent=''}catch(error){showError(['TimeoutError','AbortError'].includes(error.name)?'Status delayed · retrying…':error)}await new Promise(resolve=>setTimeout(resolve,500))}}
async function action(id,name){
 const camera=cameras.find(c=>c.id===id);if(name==='save'&&camera.saving)return;
 errorBox.textContent='';if(name==='save'){camera.saving=true;camera.saveState=null;camera.saveError=null;updateStatus(lastStatus)}
 try{
  const data=await post(`/api/camera/${name}`,{camera_id:id,mode:'auto'});
  if(name==='save'){
   if(!data.ok||String(data.saved)!==id)throw new Error('Save was not confirmed');
   camera.saveState='saved';try{localStorage.setItem(savedKey(id),JSON.stringify(camera.saveSignature))}catch{}
  }else if(['compute','restart','capture','start'].includes(name)){clearSave(camera)}
  if(data.status)updateStatus(data.status);
  if(name==='compute'){document.querySelectorAll('.step')[1].className='step done';document.querySelectorAll('.step')[2].className='step active'}
  if(name==='restart'){document.querySelectorAll('.step')[1].className='step active';document.querySelectorAll('.step')[2].className='step'}
 }catch(error){if(name==='save'){camera.saveState='failed';camera.saveError=error.message;showError(new Error(`Camera ${id}: ${error.message}`))}else showError(error)}
 finally{if(name==='save')camera.saving=false;updateStatus(lastStatus)}
}
async function bootstrap(){try{const response=await fetch('/api/cameras',{cache:'no-store'}),data=await response.json();if(!response.ok)throw new Error(data.error||'Could not load cameras');calibrationToken=data.token;cameras=data.cameras.map(id=>({id:String(id),previewUrl:data.preview_urls?.[id]}));buildCards();running=true;cameras.forEach(refreshCamera);refresh()}catch(error){showError(error)}}
document.querySelector('#start').onclick=async()=>{const button=document.querySelector('#start');button.disabled=true;button.textContent='Connecting…';errorBox.textContent='';try{const session=await post('/api/session/start',{board:{dictionary:dict.value,squares_x:+sx.value,squares_y:+sy.value,square_length_m:+sl.value,marker_length_m:+ml.value},options:{model:model.value,min_frames:+minFrames.value}});sessionId=session.session_id;await Promise.all(cameras.map(c=>post('/api/camera/start',{camera_id:c.id,mode:'auto'})));document.querySelectorAll('.step')[0].className='step done';document.querySelectorAll('.step')[1].className='step active';button.textContent='Automatic capture running';document.querySelectorAll('aside input,aside select').forEach(input=>input.disabled=true)}catch(error){button.disabled=false;button.textContent='Start automatic capture';showError(error)}};
document.querySelector('#reset').onclick=async()=>{running=false;if(sessionId)try{await post('/api/session/close')}catch(error){showError(error)}sessionId=null;location.reload()};window.addEventListener('beforeunload',()=>{running=false});bootstrap();
</script></body></html>
